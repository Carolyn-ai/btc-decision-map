name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/public_scan.py
      - run: python -m compileall -q bootstrap.py config_ui.py runtime_config.py service.py scripts apps
  # Real Laya/market validation is performed on an Apple silicon Mac.
  # No cloud credentials or paid calls are used by this workflow.
